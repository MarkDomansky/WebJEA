name: Release
# version -> build -> publish -> docker. semantic-release decides the next
# version from the commits on the branch that was pushed; the build job stamps
# that version into the app and produces webjea-<version>.zip; only then does
# semantic-release create the tag and the GitHub release with the zip attached.
# Nothing is tagged and nothing appears on the releases page unless the build is
# green. Last, the docker job pushes the Linux images for that same version to
# GHCR and Docker Hub - after the tag, so no image ever exists for a version that
# was not released. If it fails, "Re-run failed jobs" pushes the same tags.
#
# The CHANNEL comes from the branch that was pushed, per .releaserc.cjs:
#
#   alpha     -> 2100.0.0-alpha.N   (rewrite; every squash-merged PR lands here)
#   beta      -> 2100.0.0-beta.N    (rewrite staging; fed by merging alpha)
#   master    -> GA                 (2026.9.x today, 2100.x once beta is merged)
#   beta-2026 -> 2026.9.x-rc.N      (hotfix staging for the shipping VB.NET app)
#   2026.x    -> 2026.9.x GA        (VB.NET maintenance line, once master is 2100)
#
# Promote with a real merge commit, never a squash - the analyzer needs the
# individual conventional commits to pick the bump. See CONTRIBUTING.md.
on:
  push:
    branches:
      - master
      - '2026.x'
      - beta
      - beta-2026
      - alpha
    # Docs and the manual/integration test harness do not ship in the zip, so a
    # push that only touches them cuts no release. A push that also touches
    # anything else still runs (paths-ignore only skips when *every* changed
    # file matches). Those commits are not lost - they are folded into the notes
    # of the next release that does run. Use workflow_dispatch to force one.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'LICENSE-attributions'
      - '.vscode/**'
      - '.github/instructions/**'
      - 'Test/Integration/**'
      - 'Test/Dev/**'
      - 'Test/Scripts/**'
      # Wiki publishing only - listed by name so that changes to build.ps1,
      # build.psake.ps1, release.yml and test.yml still trigger a build.
      - '.github/workflows/wiki-sync.yml'
      - '.github/workflows/sync-wiki.ps1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

# semantic-release refuses to run when the local branch is behind the remote,
# so releases on the SAME branch must not overlap. Different branches are
# independent release lines and may run concurrently.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      # 'true' when the commits since the last tag warrant a release on this
      # branch. 'false' on a branch this repo does not release from.
      publish: ${{ steps.semantic.outputs.new_release_published }}
      # Bare semver, e.g. 2026.9.1 or 2100.0.0-alpha.1 (no leading v).
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: semantic-release (dry run)
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
          dry_run: true
          # Required by `preset: conventionalcommits` in .releaserc.cjs. Keep in
          # sync with the publish job, or the two runs could disagree.
          extra_plugins: |
            conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Report decision
        run: |
          if [ "${{ steps.semantic.outputs.new_release_published }}" = "true" ]; then
            echo "::notice::Next release: v${{ steps.semantic.outputs.new_release_version }}"
          else
            echo "::notice::No release warranted for these commits - skipping build."
          fi

  build:
    name: Build WebJEA
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      # build.ps1 restores, compiles with -p:Version, runs xUnit + Jest, and
      # publishes the self-contained win-x64 site into the output folder.
      - name: Build, test and package
        shell: pwsh
        env:
          AWS_KEY: ${{ secrets.AWS_KEY }}
          AWS_KEYSEC: ${{ secrets.AWS_KEYSEC }}
          AWS_QUEUE_URL: ${{ secrets.AWS_QUEUE_URL }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'build-output'
          $result = & "$env:GITHUB_WORKSPACE\.github\workflows\build.ps1" -OutputPath $out -BuildConfiguration Release -Version $env:RELEASE_VERSION
          if ("$($result.Version)" -ne $env:RELEASE_VERSION) {
            throw "build.ps1 stamped '$($result.Version)' but semantic-release computed '$env:RELEASE_VERSION'."
          }
          # build-info.json is a build-side artifact, not part of the package.
          Remove-Item (Join-Path $out 'build-info.json') -ErrorAction Ignore
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = "dist/webjea-$env:RELEASE_VERSION.zip"
          Compress-Archive -Path "$out/*" -DestinationPath $zip -Force
          Get-Item $zip | Select-Object Name, Length
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/webjea-*.zip
          if-no-files-found: error
          # Consumed by `publish` in this run; the week is a debug window. The
          # published release keeps the zip permanently.
          retention-days: 7

  publish:
    name: Tag and Publish Release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release needs the full history to reach the last tag.
          fetch-depth: 0
          persist-credentials: false
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/
      # Same analysis as the `version` job on the same commit, so it lands on
      # the same version - but this run creates the tag, generates the notes and
      # uploads dist/* to the release on this branch's channel.
      - name: semantic-release (tag + publish)
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
          # Keep in sync with the version job.
          extra_plugins: |
            conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify published version matches the built artifact
        run: |
          EXPECTED="${{ needs.version.outputs.version }}"
          ACTUAL="${{ steps.semantic.outputs.new_release_version }}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Published v$ACTUAL but the build produced v$EXPECTED."
            exit 1
          fi
          echo "::notice::Published v$ACTUAL"

  # Linux images (amd64 + arm64), minimal and -pwsh, on both registries. GHCR is
  # the primary registry (docs and examples point there); Docker Hub mirrors it.
  #
  #   alpha  2100.0.0-alpha.7  -> 2100.0.0-alpha.7, alpha
  #   beta   2100.0.0-beta.2   -> 2100.0.0-beta.2, beta
  #   GA     2100.1.0          -> 2100.1.0, 2100.1, 2100, latest
  #
  # The -pwsh variant gets the same tags with a -pwsh suffix (latest-pwsh, ...).
  # The VB.NET lines (beta-2026, 2026.x) have no docker/ folder and no copy of
  # this job, so they never publish images.
  docker:
    name: Publish Docker Images
    needs: [version, publish]
    # Only the public repo owns these image names; a release cut in a fork or
    # the dev mirror must not overwrite them.
    if: github.repository == 'markdomansky/WebJEA'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Put the description/source annotations on the multi-arch index as well as
      # on each platform manifest; GHCR and Docker Hub read them from the index.
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # QEMU only runs the trivial RUN steps of the arm64 runtime stages; the
      # Dockerfile cross-compiles with the native SDK.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # semver patterns other than {{version}} are skipped for prereleases, so
      # alpha/beta never move 2100, 2100.x or latest.
      - name: Image tags (minimal)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/markdomansky/webjea
            docker.io/markdomansky/webjea
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=semver,pattern={{major}},value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ !contains(env.VERSION, '-') }}
            type=raw,value=alpha,enable=${{ github.ref_name == 'alpha' }}
            type=raw,value=beta,enable=${{ github.ref_name == 'beta' }}
          labels: |
            org.opencontainers.image.title=WebJEA
            org.opencontainers.image.description=Self-service web portal for delegated PowerShell scripts (Linux, Entra ID)
          annotations: |
            org.opencontainers.image.title=WebJEA
            org.opencontainers.image.description=Self-service web portal for delegated PowerShell scripts (Linux, Entra ID)
      - name: Image tags (pwsh)
        id: meta-pwsh
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/markdomansky/webjea
            docker.io/markdomansky/webjea
          flavor: |
            latest=false
            suffix=-pwsh,onlatest=true
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=semver,pattern={{major}},value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ !contains(env.VERSION, '-') }}
            type=raw,value=alpha,enable=${{ github.ref_name == 'alpha' }}
            type=raw,value=beta,enable=${{ github.ref_name == 'beta' }}
          labels: |
            org.opencontainers.image.title=WebJEA (pwsh)
            org.opencontainers.image.description=WebJEA plus an interactive pwsh for troubleshooting (Linux, Entra ID)
          annotations: |
            org.opencontainers.image.title=WebJEA (pwsh)
            org.opencontainers.image.description=WebJEA plus an interactive pwsh for troubleshooting (Linux, Entra ID)

      # Telemetry credentials go in as BuildKit secrets, the same values the
      # build job compiles into the zip (see the Dockerfile's build stage). No
      # cross-run cache: release images are built from scratch; the pwsh build
      # reuses the build stage from this job's local buildx cache.
      - name: Build and push (minimal)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.VERSION }}
          secrets: |
            AWS_KEY=${{ secrets.AWS_KEY }}
            AWS_KEYSEC=${{ secrets.AWS_KEYSEC }}
            AWS_QUEUE_URL=${{ secrets.AWS_QUEUE_URL }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
      - name: Build and push (pwsh)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: pwsh
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.VERSION }}
          secrets: |
            AWS_KEY=${{ secrets.AWS_KEY }}
            AWS_KEYSEC=${{ secrets.AWS_KEYSEC }}
            AWS_QUEUE_URL=${{ secrets.AWS_QUEUE_URL }}
          push: true
          tags: ${{ steps.meta-pwsh.outputs.tags }}
          labels: ${{ steps.meta-pwsh.outputs.labels }}
          annotations: ${{ steps.meta-pwsh.outputs.annotations }}
      - name: Report pushed tags
        run: |
          {
            echo "### Docker images v$VERSION"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "${{ steps.meta-pwsh.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
