# Single WebJEA instance.
#
#   1. Create an Entra app registration (docs/entra.md) and fill in the .env values
#      referenced below (TENANT_ID, CLIENT_ID, WEBJEA_CLIENT_SECRET). For a certificate
#      instead of a secret, use the commented ClientCredentials lines and ./certs mount
#      (docs/docker.md).
#   2. Put your webjea.json + scripts in ./scripts
#   3. docker compose -f docker-compose.single.yml up -d
#
# The image is the published one (linux/amd64 + linux/arm64). Pin a release with
# WEBJEA_TAG in .env, e.g. WEBJEA_TAG=2100.0.0, or WEBJEA_TAG=alpha / beta to follow
# a prerelease channel. Append -pwsh (e.g. latest-pwsh) for the troubleshooting
# variant with an interactive shell. Docker Hub mirror: markdomansky/webjea
#
# Linux containers are Entra-only (Windows/AD auth needs a Windows host).
services:
  webjea:
    image: ghcr.io/markdomansky/webjea:${WEBJEA_TAG:-latest}
    ports:
      - "8080:8080"            # front this with your TLS-terminating proxy in production
    environment:
      Authentication__Mode: Entra
      AzureAd__Instance: https://login.microsoftonline.com/
      AzureAd__TenantId: ${TENANT_ID}
      AzureAd__ClientId: ${CLIENT_ID}
      AzureAd__ClientSecret: ${WEBJEA_CLIENT_SECRET}
      # AzureAd__ClientCredentials__0__SourceType: Path
      # AzureAd__ClientCredentials__0__CertificateDiskPath: /certs/graph.pfx
      # AzureAd__ClientCredentials__0__CertificatePassword: ${WEBJEA_GRAPH_PFX_PASSWORD}
      AzureAd__CallbackPath: /signin-oidc
    volumes:
      - ./scripts:/webjea/scripts
      - ./logs:/webjea/logs
      # - ./certs:/certs:ro
    restart: unless-stopped
