# Path-routed front-end for docker-compose.subsites.yml.
# The path prefix is NOT stripped: each app is told its prefix via WebJEA__PathBase
# and serves /hr/... itself, so proxy_pass has no trailing URI.
worker_processes auto;

events { worker_connections 1024; }

http {
    # Sticky sessions (ip_hash): WebJEA session state is in-memory per container, so a
    # client must keep hitting the same replica once an instance is scaled beyond one.
    upstream webjea_hr {
        ip_hash;
        server webjea-hr:8080;
    }

    upstream webjea_finance {
        ip_hash;
        server webjea-finance:8080;
    }

    server {
        listen 8080;
        # In production: listen 443 ssl; ssl_certificate ...; and redirect port 80.

        # The app builds auth redirects (Entra signin-oidc) from these headers; the
        # image ships with ASPNETCORE_FORWARDEDHEADERS_ENABLED=true to consume them.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /hr/      { proxy_pass http://webjea_hr; }
        location /finance/ { proxy_pass http://webjea_finance; }

        # Exact-match redirects so /hr (no slash) works too.
        location = /hr      { return 301 /hr/; }
        location = /finance { return 301 /finance/; }
    }
}
