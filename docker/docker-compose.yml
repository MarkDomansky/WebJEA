# WebJEA on Linux containers. Run from this folder:
#   docker compose up -d
#
# Put your webjea.json and scripts in ./scripts before starting (see
# docs/docker.md). Linux hosting requires Entra ID authentication.
name: webjea
services:
  node:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      # To troubleshoot, switch to the variant with an interactive shell:
      # target: pwsh and image: webjea:latest-pwsh, then
      # `docker compose up -d --build` and `docker exec -it <container> pwsh`.
      target: runtime
    image: webjea:latest
    ports:
      - "8080:8080"
    environment:
      Authentication__Mode: Entra
      AzureAd__TenantId: "<tenant-guid>"
      AzureAd__ClientId: "<client-id>"
      # Graph client credential: a client secret, or (recommended) a certificate.
      # For a certificate, replace ClientSecret with the three lines below and
      # mount ./certs (see docs/docker.md).
      AzureAd__ClientSecret: "<client-secret>"
      # AzureAd__ClientCredentials__0__SourceType: Path
      # AzureAd__ClientCredentials__0__CertificateDiskPath: /certs/graph.pfx
      # AzureAd__ClientCredentials__0__CertificatePassword: "<pfx-password>"
      # Enable only when the container itself terminates TLS (see docs/docker.md);
      # with a TLS-terminating reverse proxy in front, leave these off. Listeners and
      # the certificate are standard Kestrel settings; with an https URL bound, plain
      # HTTP is redirected to it automatically (publish 8443 too).
      # ASPNETCORE_URLS: "https://+:8443;http://+:8080"
      # Kestrel__Certificates__Default__Path: /https/webjea.pfx
      # Kestrel__Certificates__Default__Password: "<pfx-password>"
    volumes:
      - ./scripts:/webjea/scripts
      - ./logs:/webjea/logs
      # - ./certs:/https:ro   # only needed for the direct-TLS example above
      # - ./certs:/certs:ro   # only needed for the Graph certificate above
    restart: unless-stopped
